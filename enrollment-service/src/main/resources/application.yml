spring:
  application:
    name: enrollment-service
  datasource:
    url: "jdbc:mysql://${DB_HOST:localhost}:3306/enrollmentsdb?createDatabaseIfNotExist=true"
    username: root
    password: maher
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    database-platform: org.hibernate.dialect.MySQLDialect

server:
  port: ${ENROLLMENT_PORT:8083}

springdoc:
  swagger-ui:
    path: /docs

eureka:
  client:
    serviceUrl:
      defaultZone: "${EUREKA_URL:http://localhost:8761/eureka/}"
  instance:
    prefer-ip-address: true
