server:
  port: ${ACADEMIC_PORT:8082}

spring:
  datasource:
    url: "jdbc:mysql://${DB_HOST:localhost}:3306/${ACADEMIC_DB:academicdb}?createDatabaseIfNotExist=true"
    username: ${DB_USER:root}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    database-platform: org.hibernate.dialect.MySQLDialect

springdoc:
  swagger-ui:
    path: /docs

eureka:
  client:
    serviceUrl:
      defaultZone: "${EUREKA_URL:http://localhost:8761/eureka/}"
  instance:
    prefer-ip-address: true
